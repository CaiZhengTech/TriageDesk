<text x="518" y="178" font-size="11" fill="#5b6570">official v1</text>
<text x="288" y="228" font-size="12.5" fill="#1b1f24" text-anchor="end">Judge v2  vs  human round 2</text>
<rect x="300" y="208" width="74.5" height="30" fill="url(#hatch)" rx="2"/>
<text x="384" y="228" font-size="13" fill="#1b1f24" font-weight="700">0.133</text>
<text x="436" y="228" font-size="11" fill="#5b6570">official v2 - the quoted number</text>
<text x="288" y="278" font-size="12.5" fill="#1b1f24" text-anchor="end">Judge v1  vs  human round 2</text>
<rect x="300" y="258" width="21.3" height="30" fill="url(#hatch)" rx="2"/>
<text x="331" y="278" font-size="13" fill="#1b1f24" font-weight="700">0.038</text>
<line x1="418.7" y1="88" x2="418.7" y2="290" stroke="#b4413c" stroke-width="2" stroke-dasharray="5,4"/>
<text x="426" y="83" font-size="11.5" fill="#b4413c" font-weight="700">human vs. himself, &#954; = 0.212</text>
<text x="34" y="350" font-size="11.5" fill="#1b1f24"><tspan font-weight="700">Read the dashed line first.</tspan> Judge v2 agrees with the human&#8217;s round-1 labels (0.418) <tspan font-weight="700">more than the human agrees with himself</tspan> (0.212).</text>
<text x="34" y="368" font-size="11.5" fill="#5b6570">Single-rater ground truth is the measured bottleneck, so the fix is a second rater, not more judge tuning. The judge gates nothing.</text>
<rect x="34" y="382" width="13" height="13" fill="url(#hatch)" rx="2"/>
<text x="53" y="393" font-size="11" fill="#5b6570">hatched = archived, not reproducible: the completed round-2 labels were lost with the database (#64)</text>
