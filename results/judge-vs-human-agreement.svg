<rect x="300" y="108" width="234.1" height="30" fill="#2f6f4f" rx="2"/>
<text x="544" y="128" font-size="13" fill="#1b1f24" font-weight="700">0.418</text>
<text x="596" y="128" font-size="11" fill="#5b6570">the tool-evidence fix, best case</text>
<text x="288" y="178" font-size="12.5" fill="#1b1f24" text-anchor="end">Judge v1  vs  human round 1</text>
