<text x="34" y="40" font-size="19" fill="#1b1f24" font-weight="700">Judge-human agreement: the human is the noisier instrument</text>
<text x="34" y="62" font-size="12.5" fill="#5b6570">Cohen&#8217;s &#954; on 41 blind labels. Same judge, two human label rounds; same human, same 41 replies, 3 days apart.</text>
<text x="34" y="94" font-size="12" fill="#5b6570" font-weight="700">AGREEMENT (&#954;)</text>
<line x1="300.0" y1="102" x2="300.0" y2="294" stroke="#d6dbe1" stroke-width="1"/>
<text x="300" y="314" font-size="10.5" fill="#5b6570" text-anchor="middle">0.0</text>
<line x1="356.0" y1="102" x2="356.0" y2="294" stroke="#d6dbe1" stroke-width="1"/>
<text x="356" y="314" font-size="10.5" fill="#5b6570" text-anchor="middle">0.1</text>
<line x1="412.0" y1="102" x2="412.0" y2="294" stroke="#d6dbe1" stroke-width="1"/>
<text x="412" y="314" font-size="10.5" fill="#5b6570" text-anchor="middle">0.2</text>
