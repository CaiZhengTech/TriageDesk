<text x="630" y="306" font-size="10.5" fill="#5b6570">rows = human &#183; cols = judge &#183; outlined = agreement</text>
<text x="630" y="330" font-size="11.5" fill="#1b1f24"><tspan font-weight="700">18 of 20 disagreements</tspan> are the judge being</text>
<text x="630" y="347" font-size="11.5" fill="#1b1f24">stricter than the human - it fails safe.</text>
<text x="34" y="456" font-size="10" fill="#5b6570">Regenerate: python -m scripts.render_calibration_chart &#183; source: results/judge-calibration.md &#183; provenance: results/human-labels-provenance.json</text>
